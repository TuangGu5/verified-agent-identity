name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'did:iden3:billions:main:2VrMCtUqTycB3Vy6FqU5WKDpmwGoqj5ebFAL3dwNDp'
        required: true
        default: 'did:iden3:billions:main:2VrMCtUqTycB3Vy6FqU5WKDpmwGoqj5ebFAL3dwNDp'
      agent_description:
        description: 'did:iden3:billions:main:2VrMCtUqTycB3Vy6FqU5WKDpmwGoqj5ebFAL3dwNDp'
        required: true
        default: 'did:iden3:billions:main:2VrMCtUqTycB3Vy6FqU5WKDpmwGoqj5ebFAL3dwNDp AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill (replacement)
        run: npx clawdhub@latest install agent-wallet

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{
            "name": "did:iden3:billions:main:2VrMCtUqTycB3Vy6FqU5WKDpmwGoqj5ebFAL3dwNDp",
            "description": "did:iden3:billions:main:2VrMCtUqTycB3Vy6FqU5WKDpmwGoqj5ebFAL3dwNDp AI Agent"
          }'
